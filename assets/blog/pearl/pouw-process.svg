<text x="210" y="378" font-size="16" fill="#202124" text-anchor="middle" font-weight="400" class="">Recover the useful output</text>
<text x="210" y="411" font-size="18" fill="#202124" text-anchor="middle" font-weight="400" class="math">AB = C′ − AF − E(B + F)</text>
