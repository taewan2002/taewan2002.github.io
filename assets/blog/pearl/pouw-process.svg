<path d="M250 120 V140 H380.0 V157" fill="none" stroke="#202124" stroke-width="1.15" marker-end="url(#arrow)"/>
<path d="M500.0 48 V88" fill="none" stroke="#c7c9cd" stroke-width="1.15"/>
