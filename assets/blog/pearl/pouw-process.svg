<text x="550" y="405" font-size="16" fill="#202124" text-anchor="middle" font-weight="400" class="math">H(transcript) &lt; target</text>
<path d="M550 417 V449" fill="none" stroke="#202124" stroke-width="1.15" marker-end="url(#arrow)"/>
<text x="562" y="438" font-size="12" fill="#666a70" text-anchor="start" font-weight="400" class="">If met</text>
<text x="550" y="474" font-size="15" fill="#202124" text-anchor="middle" font-weight="400" class="">Submit proof + block</text>
