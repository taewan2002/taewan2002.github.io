<text x="510" y="110" font-size="20" fill="#202124" text-anchor="middle" font-weight="400" class="math">B + F</text>
<path d="M510 120 V140 H380.0 V157" fill="none" stroke="#202124" stroke-width="1.15" marker-end="url(#arrow)"/>
<rect x="150" y="160" width="460" height="143" fill="none" stroke="#202124"/>
<text x="380.0" y="187" font-size="18" fill="#202124" text-anchor="middle" font-weight="400" class="math">C′ = (A + E)(B + F)</text>
