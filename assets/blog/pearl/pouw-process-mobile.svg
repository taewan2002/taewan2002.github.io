<svg xmlns="http://www.w3.org/2000/svg" width="360" height="590" viewBox="0 0 360 590" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Matrix multiplication: useful output and proof-of-work transcript</title><desc id="desc">Add low-rank noise E and F to input matrices A and B. Record partial sums in a prescribed order while computing C prime. Remove noise to recover AB; hash the transcript to check the mining target. If the target is met, submit a proof and block for other nodes to verify.</desc>
